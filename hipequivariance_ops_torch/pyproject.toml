[build-system]
# A range, not a pin: distro and offline builds bring their own hatchling.
# 1.27 is the first release writing PEP 639 license-file metadata.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hipequivariance-ops-torch"
version = "1.0.0"
description = "Zero-code-change cuequivariance_ops_torch shim for AMD ROCm, backed by geometric-nn-ops Triton kernels."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.12.*"
authors = [{ name = "Advanced Micro Devices, Inc." }]
keywords = ["triton", "rocm", "hip", "amd", "alphafold", "openfold", "cuequivariance"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "geometric-nn-ops-torch",
    "torch==2.13.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "cuequivariance==0.9.1",
    "cuequivariance-torch==0.9.1",
]

[project.urls]
"Source" = "https://github.com/ROCm/geometric-nn-ops"

[tool.hatch.build.targets.wheel]
packages = ["cuequivariance_ops_torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
