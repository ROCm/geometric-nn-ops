#
# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Paused: open-pull-requests-limit 0 stops all version-update PRs, so the
# schedules, cooldowns and groups below are idle. Security-update PRs are off
# in repository settings, so Dependabot raises alerts only.

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "daily"
      # Wait a week before adopting newly released action versions.
    cooldown:
      default-days: 7
      exclude:
        - "ROCm/rocm-security-gh*"
    groups:
      rocm-security-gh:
        patterns: ["ROCm/rocm-security-gh*"]
      github-actions:
        patterns: ["*"]

  # increase-if-necessary never raises a floor a new release already
  # satisfies, so this only bumps exact pins such as the CI build frontend.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/.github/ci"
      - "/hipequivariance_ops_torch"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    # `ignore` also suppresses security-update PRs (not alerts) for these
    # dev/test-only pins: ruff moves in lockstep with the pre-commit rev, and
    # cuequivariance is the exact API the shim is tested against.
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "cuequivariance"
      - dependency-name: "cuequivariance-torch"
    groups:
      python-deps:
        patterns: ["*"]
        # One PR across both packages, so their pins cannot diverge.
        group-by: dependency-name
