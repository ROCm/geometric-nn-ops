#
# PR-side security scans, defined by the pinned ROCm/rocm-security-gh
# baseline. Reports go to the job summary and an artifact, except CodeQL
# (public repos only), which uploads to code scanning; pull-requests: write
# lets same-repo PRs get a findings comment.

name: Security scan (PR)

on:
  pull_request:
    # Spelled out the default to avoid confusion.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@f92f9387d10fe91a0293762bdcefd3ba012a827b # v1.0.7
    with:
      report_formats: human
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
