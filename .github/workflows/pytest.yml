name: Tests

on:
  # Not push+pull_request because then it runs twice for PRs from branches
  # within the repo.
  pull_request:
  push:
    branches: [main]
  # Lets anyone with write access probe the GPU runner without setting
  # RUN_GPU_TESTS.
  workflow_dispatch:

# A new push to a PR cancels that PR's previous run. Pushes to main fall back
# to the unique run_id and so never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The supported Python version (requires-python is 3.12.*); the
          # GPU job's image ships the same.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            hipequivariance_ops_torch/pyproject.toml

      - name: Install
        run: |
          python -m pip install --only-binary=":all:" "torch==2.13.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=":all:" -e ".[test]" -e "./hipequivariance_ops_torch[test]"

      # Runners have no GPU, so most tests skip and this is mainly a check that
      # every module still imports and collects.
      - name: Run CPU-only tests
        run: python -m pytest -m "" -vrxs tests hipequivariance_ops_torch/tests


  pytest-gpu:
    # Kill switch for the single self-hosted GPU runner; skips fork PRs by default.
    # A PR runs its own copy of this file and can drop the guard, so keeping fork
    # code off the machine rests on the fork-PR approval and runner-group settings.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (vars.RUN_GPU_TESTS == 'true'
          && (github.event_name == 'push'
              || github.event.pull_request.head.repo.full_name == github.repository))
    # Covers pulling the ~25 GB image on a cold runner.
    timeout-minutes: 60
    runs-on:
      - linux-gfx1151-gpu-rocm
    container:
      # rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.13.0
      image: rocm/pytorch@sha256:b11c021675620aa82d1eaa2d1e78387dde7521bb5b972ce0ad47b6b004d4e7aa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-python: the image ships 3.12 with torch in a venv on PATH.
      - name: Install
        run: python3 -m pip install --only-binary=":all:" -e ".[test]" -e "./hipequivariance_ops_torch[test]"

      - name: Show torch build
        run: python -c 'import torch; print(f"{torch.__version__=}, {torch.cuda.is_available()=}, {torch.cuda.device_count()=}, {torch.version.hip=}, {torch.cuda.get_arch_list()=}")'

      - name: Run GPU tests
        # -m "" includes the large tests that are excluded by default
        run: python -m pytest -m "" -vrxs tests hipequivariance_ops_torch/tests
